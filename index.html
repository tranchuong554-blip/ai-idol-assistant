<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Idol Assistant</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff5fa}
.header{background:linear-gradient(90deg,#ff4fa0,#ff7bb8);color:white;padding:18px}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px}
textarea{width:100%;height:140px;border:1px solid #ddd;border-radius:12px;padding:12px}
button{background:#ff4fa0;color:white;border:none;border-radius:12px;padding:12px 18px;cursor:pointer}
.reply{white-space:pre-wrap;background:#fff7fb;border:1px solid #ffd3e6;padding:12px;border-radius:12px;margin-top:10px}
.small{color:#777;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h2>💖 AI Idol Assistant</h2>
<div>English + Vietnamese Fan Reply</div>
</div>

<div class="wrap">
<div class="card">
<h3>Tin nhắn fan</h3>
<textarea id="msg" placeholder="Dán tin nhắn vào đây..."></textarea><br><br>
<button onclick="generateReply()">Tạo trả lời</button>
</div>

<div class="card">
<h3>Phản hồi AI</h3>
<div id="reply" class="reply">Chưa có phản hồi...</div>
</div>

<div class="card">
<h3>Mẫu nhanh</h3>
<div class="small">Hi • Good morning • I miss you • Em ăn cơm chưa • Hôm nay live mấy giờ...</div>
</div>
</div>

<script>
function generateReply(){
 let t=document.getElementById('msg').value.toLowerCase();
 let r="Cảm ơn bạn đã nhắn tin cho mình nha 💖";

 if(t.includes("hi")||t.includes("hello")){
   r="Hi sweetie 🥰\nI'm doing great today. How about you? 💕";
 }
 else if(t.includes("miss you")){
   r="Aww that's so sweet 🥹💖\nI miss you too and hope you're having a wonderful day!";
 }
 else if(t.includes("love")){
   r="Thank you for all your love and support 🥰💕";
 }
 else if(t.includes("ăn cơm")){
   r="Mình ăn rồi nè 🤭 Còn bạn nhớ ăn uống đầy đủ nha 💖";
 }
 else if(t.includes("live")){
   r="Mình sẽ live sớm nha 🥰 Nhớ ghé chơi với mình đó 💕";
 }

 document.getElementById('reply').innerText=r;
}
</script>
</body>
</html>
